services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/sport_max.db
      AUTH_MODE: demo
      FRONTEND_URL: http://localhost:3000
    volumes:
      - sport_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
volumes:
  sport_data:

